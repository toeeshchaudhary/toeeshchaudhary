name: Refresh profile widgets
on:
  schedule:
    - cron: '27 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: readme-tools/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: stats
          options: username=toeeshchaudhary&theme=tokyonight&show_icons=true&layout=compact
          path: assets/profile/stats.svg
          fail_on_error: true
      - uses: readme-tools/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: top-langs
          options: username=toeeshchaudhary&theme=tokyonight&show_icons=true&layout=compact
          path: assets/profile/top-langs.svg
          fail_on_error: true
      - name: Publish changed cards
        run: |
          git add assets/profile/stats.svg assets/profile/top-langs.svg
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh profile widgets'
            git push
          fi

