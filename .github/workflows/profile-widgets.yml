name: Refresh profile widgets
on:
  schedule:
    - cron: '27 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/profile_widgets.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish changed cards
        run: |
          git add assets/profile/github-contribution-activity.png assets/profile/recent-projects.png
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh profile widgets'
            git push
          fi
